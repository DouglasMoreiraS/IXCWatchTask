spring.application.name=IXCWatchTask

#IA: Configure credenciais e caminhos por variaveis de ambiente para evitar segredos no codigo-fonte.
ixc.api.base-url=${IXC_API_BASE_URL:https://central.planetinternetprovedor.com.br/webservice/v1/}
ixc.api.auth=${IXC_AUTH:}
watch.api.delete-url=${WATCH_API_DELETE_URL:https://apiweb.watch.tv.br/watch/v1/tickets/delete}
watch.api.search-url=${WATCH_API_SEARCH_URL:https://apiweb.watch.tv.br/watch/v2/tickets/get}
watch.web.login=${IXC_WEB_LOGIN:}
watch.web.password=${IXC_WEB_PASSWORD:}
watch.web.debug=${WATCH_WEB_DEBUG:false}
selenium.chrome.driver-path=${SELENIUM_CHROME_DRIVER_PATH:C:\\ixcwatchtask\\driver\\chromedriver.exe}
selenium.chrome.binary-path=${SELENIUM_CHROME_BINARY_PATH:C:\\ixcwatchtask\\browser\\chrome-win\\chrome.exe}
